name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Public URL of the website ZIP'
        required: true
        type: string
      icon_url:
        description: 'Public URL of the APK icon image'
        required: true
        type: string
      release_tag:
        description: 'Release tag for this build'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Pillow
        run: python3 -m pip install --user Pillow

      - name: Download ZIP and icon
        run: |
          mkdir -p build-input/web build-input/job
          curl -L --fail --retry 3 "${{ inputs.zip_url }}" -o build-input/site.zip
          curl -L --fail --retry 3 "${{ inputs.icon_url }}" -o build-input/icon
          unzip -q build-input/site.zip -d build-input/web

      - name: Build release APK
        run: node scripts/build-apk.js build-input/web build-input/job build-input/icon

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" build-input/job/app-release.apk --clobber --repo "${{ github.repository }}"
